name: Bug report
description: Something in Better Helpdesk does not work as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Better Helpdesk version
      description: From your lockfile, for example 0.5.4.
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - Postgres
        - MySQL
        - SQLite
        - MS SQL
        - Custom adapter
    validations:
      required: true
  - type: input
    id: framework
    attributes:
      label: Next.js version
      description: Or the framework and version if you mount the handler elsewhere.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest setup that shows the problem. Leave out real customer data.
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened instead, with any error message or log output.
    validations:
      required: true
