name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Tag must match package.json version
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "$(node -p "require('./package.json').version")" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json" >&2
            exit 1
          fi
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      - name: Is this version already on npm?
        id: npm
        run: echo "published=$(npm view "$(node -p "require('./package.json').name")@${GITHUB_REF_NAME#v}" version 2>/dev/null)" >> "$GITHUB_OUTPUT"
      # Configure this repository and workflow as the trusted publisher of
      # better-helpdesk on npmjs.com; no token is stored.
      - if: steps.npm.outputs.published == ''
        run: npm publish "$RUNNER_TEMP"/pack/*.tgz --provenance --access public

  # Runs only once the publish job has succeeded. It installs nothing and runs
  # no project code, so the write below never meets a dependency or a build
  # script.
  release:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub Release for this tag
      pull-requests: read # read the titles of the merged pull requests
    steps:
      # persist-credentials: false keeps the token out of .git/config, so the
      # only thing that can write is the step handed GH_TOKEN below.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          commits=$RUNNER_TEMP/commits.tsv
          notes=$RUNNER_TEMP/release-notes.md
          # A command of its own, so a git failure fails the job. Read from a
          # process substitution its exit status would be invisible to set -e
          # and the notes would come out silently empty.
          git log --reverse --format='%H%x09%s' "${previous:+$previous..}$GITHUB_REF_NAME" > "$commits"
          # The version bump is the release, not a change within it. It reaches
          # the range as a bare "0.1.3", as "chore(release): 0.1.3", or, once
          # squashed into main, as "chore(release): 0.1.3 (#5)".
          is_the_release() {
            case "${1% (#[0-9]*)}" in
            "${GITHUB_REF_NAME#v}" | *": ${GITHUB_REF_NAME#v}") return 0 ;;
            esac
            return 1
          }
          seen=
          changed=
          while IFS=$'\t' read -r sha subject; do
            if is_the_release "$subject"; then continue; fi
            pull=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" \
              --jq 'first(.[]) | "\(.number)\t\(.title)"' </dev/null 2>/dev/null || true)
            if [ -z "$pull" ]; then
              # A merge commit is no change of its own, and with the lookup
              # gone there is no pull request title to name it by. What it
              # merged is in this range already and speaks for itself.
              case "$subject" in
              'Merge pull request #'* | 'Merge branch '*) continue ;;
              esac
              changed=$changed"- $subject."$'\n'
              continue
            fi
            number=${pull%%$'\t'*}
            title=${pull#*$'\t'}
            # Merged as a merge commit the bump keeps a subject of its own, and
            # squashed it gains a "(#5)", so neither is caught above. Both
            # resolve to the release pull request, which is titled for the bump.
            if is_the_release "$title"; then continue; fi
            case " $seen " in *" $number "*) continue ;; esac
            seen="$seen $number"
            changed=$changed"- $title (#$number)."$'\n'
          done < "$commits"
          {
            echo '**What changed**'
            echo
            # A release whose only commit is the version bump has no bullets.
            if [ -n "$changed" ]; then
              printf '%s' "$changed"
            else
              echo '- Maintenance release.'
            fi
            echo
            echo '**Notes**'
            echo
            echo 'Published to npm with provenance via trusted publishing.'
            if [ -n "$previous" ]; then
              echo
              echo "**Full changelog:** https://github.com/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_REF_NAME"
            fi
          } > "$notes"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$notes"
