name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Tag must match package.json version
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "$(node -p "require('./package.json').version")" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json" >&2
            exit 1
          fi
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      - name: Is this version already on npm?
        id: npm
        run: echo "published=$(npm view "$(node -p "require('./package.json').name")@${GITHUB_REF_NAME#v}" version 2>/dev/null)" >> "$GITHUB_OUTPUT"
      # Configure this repository and workflow as the trusted publisher of
      # better-helpdesk on npmjs.com; no token is stored.
      - if: steps.npm.outputs.published == ''
        run: npm publish "$RUNNER_TEMP"/pack/*.tgz --provenance --access public
