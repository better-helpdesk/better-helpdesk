name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Monday morning, to find out what next@canary broke while nobody looked.
  schedule:
    - cron: '0 6 * * 1'
  # release.yml runs all of this before it publishes.
  workflow_call:

jobs:
  check:
    name: check (node ${{ matrix.node }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The floor package.json's engines promises, and the current release.
        node: ['22.19', '24']
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: db
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/db
      TEST_MYSQL_URL: mysql://root@127.0.0.1:3306/
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # The example app is a workspace package now; it has no part in this job
      # and its Next.js install is not worth downloading here.
      - run: pnpm install --filter better-helpdesk --frozen-lockfile
      # A service container cannot take a password made at run time; this
      # one exists only for this job and is never written down.
      - name: Start SQL Server
        run: |
          password="Ci-$(openssl rand -hex 16)!"
          echo "::add-mask::$password"
          docker run -d --name mssql -p 1433:1433 -e ACCEPT_EULA=Y \
            -e "MSSQL_SA_PASSWORD=$password" mcr.microsoft.com/mssql/server:2022-latest
          for _ in $(seq 1 60); do
            docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa \
              -P "$password" -Q 'select 1' > /dev/null 2>&1 && break
            sleep 2
          done
          url_password=$(node -p 'encodeURIComponent(process.argv[1])' "$password")
          echo "TEST_MSSQL_URL=mssql://sa:$url_password@localhost:1433/" >> "$GITHUB_ENV"
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run test:integration
      # pnpm pack, not npm pack: only pnpm applies publishConfig's dist exports.
      - run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      - name: Smoke-test the tarball outside the repo
        run: |
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/pack/*.tgz pg react react-dom
          # For better-helpdesk/testing. Node 22's npm 10 crashes resolving
          # vitest's peers ("reading 'edgesOut'") unless it skips them.
          npm install --no-audit --no-fund --legacy-peer-deps vitest@4
          HELPDESK_DATABASE_URL="$TEST_DATABASE_URL" node "$GITHUB_WORKSPACE/scripts/smoke.mjs"

  # Divio deploys site/ from main, and nothing else here compiles it.
  site:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --filter better-helpdesk-site --frozen-lockfile
      - run: pnpm --filter better-helpdesk-site exec tsc --noEmit
      - run: pnpm --filter better-helpdesk-site run build

  # Builds and runs examples/demo against the packed tarball, which resolves
  # the published dist exports rather than the workspace link the app uses in
  # development. A host app is where that difference shows up.
  example:
    name: example (next@${{ matrix.target.next }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Today's Next.js and the previous major on every pull request; the
        # weekly run swaps in canary, where a failure blocks nobody. Next.js 15
        # cannot drive the TypeScript 7 compiler, so each entry brings its own.
        target: >-
          ${{ fromJSON(github.event_name == 'schedule' &&
          '[{"next":"canary","typescript":"7"}]' ||
          '[{"next":"latest","typescript":"7"},{"next":"15","typescript":"6"}]')
          }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: db
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HELPDESK_DATABASE_URL: postgres://postgres@localhost:5432/db
      DEMO_URL: http://localhost:3000
      DEMO_UNSAFE_AUTH: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --filter better-helpdesk --frozen-lockfile
      - run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      # Outside the repository, so the workspace link cannot resolve and npm,
      # not pnpm, does the installing: a missing peer or transitive dependency
      # has to surface here rather than hide behind pnpm's stricter tree.
      - name: Install the example against the tarball
        run: |
          cp -r examples/demo "$RUNNER_TEMP/app"
          cd "$RUNNER_TEMP/app"
          npm pkg set dependencies.better-helpdesk="file:$(echo "$RUNNER_TEMP"/pack/*.tgz)"
          npm install --no-audit --no-fund \
            "next@${{ matrix.target.next }}" "typescript@${{ matrix.target.typescript }}"
          node -p "'next ' + require('next/package.json').version"
      - name: Migrate, build, start
        run: |
          cd "$RUNNER_TEMP/app"
          node node_modules/better-helpdesk/bin/migrate.mjs
          npm run build
          npm start &
          for _ in $(seq 1 30); do
            sleep 2
            curl -fsS -o /dev/null http://localhost:3000/ && break
          done
      # A build alone misses what only fails when the code runs: the server
      # bundle's imports, the client chunks, and the database round trip.
      - name: Use it
        run: |
          curl -fsS -o /dev/null 'http://localhost:3000/api/helpdesk/widget/session/?inbox=support'
          curl -fsS -o /dev/null http://localhost:3000/helpdesk/
          curl -fsS -o /dev/null -X POST \
            -H 'content-type: application/json' \
            -H 'Origin: http://localhost:3000' \
            -d '{"inbox":"support","type":"question","body":"Does this install still work?","email":"ci@example.test"}' \
            http://localhost:3000/api/helpdesk/widget/conversations/
          curl -fsS -o /dev/null -X PUT \
            -H 'content-type: application/json' \
            -H 'Origin: http://localhost:3000' \
            -H 'Cookie: demo-role=agent' \
            -d '{"confirmation":{"en":"Saved by CI"}}' \
            http://localhost:3000/api/helpdesk/agent/settings/
          curl -fsS -H 'Cookie: demo-role=agent' \
            http://localhost:3000/api/helpdesk/agent/settings/ | grep -q 'Saved by CI'
