# Weekly update pull requests. They cannot replace the advisory check in
# ci.yml: pnpm 12 writes the lockfile as two YAML documents, which GitHub's
# dependency graph does not read, so Dependabot raises no alerts here.
#
# One workspace, three entries that do not overlap: the package's own
# dependencies one pull request each, the examples together in one, the site
# in one. Dependabot runs pnpm in a full clone, so an entry that leaves the
# other packages out still keeps them in the shared lockfile.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    exclude-paths: [site, examples]
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Zurich
    # pnpm refuses versions younger than its minimum release age anyway; a
    # major waits a month for the tools around it to catch up.
    cooldown:
      default-days: 3
      semver-major-days: 30
    # These ranges are what hosts install: a release that already fits them
    # only moves the lockfile.
    versioning-strategy: increase-if-necessary
    ignore:
      # The types of the oldest Node the engines field promises, so code
      # cannot reach for what that Node lacks.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    # Named one by one: examples/adapters holds no package.json.
    directories:
      - /examples/astro
      - /examples/nextjs
      - /examples/nuxt
      - /examples/sveltekit
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Zurich
    cooldown:
      default-days: 3
      semver-major-days: 30
    ignore:
      # The site and the examples move to a new release in the release's own
      # last step.
      - dependency-name: better-helpdesk
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # The Astro, Nuxt and SvelteKit checkers cannot drive TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      examples:
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Zurich
    cooldown:
      default-days: 3
      semver-major-days: 30
    ignore:
      - dependency-name: better-helpdesk
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      site:
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Zurich
    # Actions are not SemVer to Dependabot, so it takes no per-type cooldown.
    # The workflows pin major tags, so nearly every update here is a major.
    cooldown:
      default-days: 30
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
