# Weekly update pull requests. They cannot replace the advisory check in
# ci.yml: pnpm 12 writes the lockfile as two YAML documents, which GitHub's
# dependency graph does not read, so Dependabot raises no alerts here.
version: 2
updates:
  # One entry for the whole workspace: Dependabot refuses to update a pnpm
  # workspace from a member's directory, so the split between the package
  # and the rest is by dependency name, in `groups` below.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Zurich
    # pnpm refuses versions younger than its minimum release age anyway; a
    # major waits a month for the tools around it to catch up.
    cooldown:
      default-days: 3
      semver-major-days: 30
    # The package's ranges are what hosts install: a release that already
    # fits them only moves the lockfile.
    versioning-strategy: increase-if-necessary
    ignore:
      # The site and the examples move to a new release in the release's own
      # last step.
      - dependency-name: better-helpdesk
      # The types of the oldest Node the engines field promises, so code
      # cannot reach for what that Node lacks.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # A migration to take on purpose; the Astro, Nuxt and SvelteKit checkers
      # cannot drive TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      # Everything the examples and the site use beyond the package's own
      # dependencies, in one pull request. The package's own dependencies,
      # the names in the root package.json, stay out of it and come one pull
      # request each: keep this list in step with that file.
      examples-and-site:
        patterns: ['*']
        exclude-patterns:
          - '@biomejs/biome'
          - '@testing-library/react'
          - '@types/node'
          - '@types/pg'
          - '@types/react'
          - '@types/react-dom'
          - esbuild
          - jsdom
          - kysely
          - mailauth
          - mailparser
          - mysql2
          - pg
          - react
          - react-dom
          - tarn
          - tedious
          - typescript
          - vitest
          - zod
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Zurich
    # Actions are not SemVer to Dependabot, so it takes no per-type cooldown.
    # The workflows pin major tags, so nearly every update here is a major.
    cooldown:
      default-days: 30
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
